<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>DoBetterMoney logo options</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #f5f5f5;
        color: #111;
        padding: 32px;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 24px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 20px;
        max-width: 800px;
      }
      figure {
        margin: 0;
        background: #fff;
        border-radius: 16px;
        padding: 16px;
        text-align: center;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
      }
      img {
        width: 120px;
        height: 120px;
        object-fit: contain;
        border-radius: 24px;
      }
      figcaption {
        margin-top: 12px;
        font-size: 14px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <h1>Pick a logo number</h1>
    <div class="grid">
      <figure>
        <img src="./logo-option-bars.png" alt="1 bars" />
        <figcaption>1 — Bars</figcaption>
      </figure>
      <figure>
        <img src="./logo-option-d.png" alt="2 d" />
        <figcaption>2 — d</figcaption>
      </figure>
      <figure>
        <img src="./logo-option-sprout.png" alt="3 sprout" />
        <figcaption>3 — Sprout</figcaption>
      </figure>
      <figure>
        <img src="./logo-option-coin.png" alt="4 coin" />
        <figcaption>4 — Coin</figcaption>
      </figure>
      <figure>
        <img src="./logo-option-db.png" alt="5 B" />
        <figcaption>5 — B</figcaption>
      </figure>
      <figure>
        <img src="./logo-option-arrow.png" alt="6 arrow" />
        <figcaption>6 — Arrow</figcaption>
      </figure>
    </div>
  </body>
</html>
